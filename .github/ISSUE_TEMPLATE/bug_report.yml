name: 🐛 Bug report
description: Something is broken or behaves unexpectedly.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve this plugin! Please search existing issues first.
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 (or a commit SHA)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: DeepSeek Harness version, OS, model/provider
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include any visible error text or diagnostics shown by the plugin.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Load the plugin with cordis_define
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Paste any Host/Client diagnostics. Remove secrets first.
    validations:
      required: false
