name: 💡 Feature request
description: Suggest an idea or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Please describe the problem before the solution.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: The friction you hit, not just the feature you want.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Host half (services, RPC handlers)
        - Client half (slots, UI)
        - Documentation
        - Other
    validations:
      required: true
